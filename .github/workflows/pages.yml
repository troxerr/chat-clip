name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "*/5 * * * *" # refresh Twitch data (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch Twitch data
        working-directory: web
        # Push builds still deploy (the app falls back to demo data); scheduled/manual runs fail
        # instead so a broken fetch never replaces a good deployment.
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/fetch-twitch-data.mjs
      - name: Build web app (served under /app/)
        working-directory: web
        env:
          VITE_BASE: /app/
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir _site
          cp -R site/. _site/
          echo clipspike.com > _site/CNAME
          cp -R web/dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
