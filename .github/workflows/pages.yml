name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  schedule:
    # */5 was dropped for hours (runs landed 6–9h apart). Two hourly off-peak minutes
    # stay inside GitHub's schedule budget instead of a 5-minute cron it silently skips.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A second hourly schedule must not abort a deploy that is already publishing.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch Twitch data
        working-directory: web
        # Push builds still deploy (the app falls back to demo data); scheduled/manual runs fail
        # instead so a broken fetch never replaces a good deployment.
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/fetch-twitch-data.mjs
      - name: Build web app (served under /app/)
        working-directory: web
        env:
          VITE_BASE: /app/
          # Monetization config from repository Variables (public values, not secrets).
          # Undefined variables resolve to "" and leave the feature off.
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED }}
          VITE_AD_PROVIDER: ${{ vars.VITE_AD_PROVIDER }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_GRID: ${{ vars.VITE_ADSENSE_SLOT_GRID }}
          VITE_ADSENSE_SLOT_SIDEBAR: ${{ vars.VITE_ADSENSE_SLOT_SIDEBAR }}
          VITE_SPONSOR_NAME: ${{ vars.VITE_SPONSOR_NAME }}
          VITE_SPONSOR_URL: ${{ vars.VITE_SPONSOR_URL }}
          VITE_SPONSOR_TEXT: ${{ vars.VITE_SPONSOR_TEXT }}
          VITE_AFFILIATES_ENABLED: ${{ vars.VITE_AFFILIATES_ENABLED }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_WAITLIST_ENDPOINT: ${{ vars.VITE_WAITLIST_ENDPOINT }}
          VITE_WAITLIST_EMAIL: ${{ vars.VITE_WAITLIST_EMAIL }}
          # Empty keeps the Polar checkout in web/src/monetization/offer.ts. A valid https value overrides it.
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_DISCORD_INVITE_URL: ${{ vars.VITE_DISCORD_INVITE_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ vars.VITE_PLAUSIBLE_SRC }}
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir _site
          cp -R site/. _site/
          echo clipspike.com > _site/CNAME
          cp -R web/dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
