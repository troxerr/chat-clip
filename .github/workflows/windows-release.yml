name: Windows release

# Manual or tag-triggered. Builds the Windows installer and the Portable exe; signs it when a
# code-signing certificate is configured (otherwise builds an UNSIGNED installer),
# attaches it to a draft GitHub release for tag builds, and uploads it to
# Cloudflare R2 for tag builds when R2 credentials are configured.
# Versions/names are not changed here.
on:
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release installer
    runs-on: windows-latest
    env:
      CLIPSPIKE_KEYCHAIN: "0"
      RUNTIME_MIRROR_URL: ${{ vars.RUNTIME_MIRROR_URL }}
      WIN_UPDATE_URL: ${{ vars.WIN_UPDATE_URL }}
      # electron-builder signs automatically when these are set.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      WIN_R2_PREFIX: ${{ vars.WIN_R2_PREFIX || 'win' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail fast, before the long build: a tag that does not match win/package.json would
      # publish an installer under the wrong version. Test builds use workflow_dispatch, not tags.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node win/tools/release-guards.js tag "$env:REF_NAME"
        shell: pwsh

      - name: Report signing status
        shell: pwsh
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            "Signing: certificate configured; the installer will be signed."
            "SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            # Clear both so electron-builder does not try to sign with a half-set pair.
            "CSC_LINK=" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CSC_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "::warning title=Unsigned build::WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are not both set. Building an UNSIGNED installer; Windows SmartScreen will warn users."
            "### Unsigned build`nNo code-signing certificate was configured (WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD). This installer is **unsigned** and Windows SmartScreen will warn users." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (-not $env:WIN_UPDATE_URL) { Write-Host "::error::Repo variable WIN_UPDATE_URL is not set; the installed app would have no update feed."; exit 1 }
          if ($env:WIN_UPDATE_URL -notmatch '^https://') { Write-Host "::error::WIN_UPDATE_URL must be an https:// URL."; exit 1 }

      - name: Check licensing is configured for release
        # Set the repo variable REQUIRE_PRODUCTION_LICENSING=true at launch to make sandbox values fail the build.
        env:
          CLIPSPIKE_REQUIRE_PRODUCTION_LICENSING: ${{ vars.REQUIRE_PRODUCTION_LICENSING }}
        run: node win/tools/check-release-config.js

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hd-runtime
          key: win-runtime-${{ hashFiles('tools/runtime-win.json') }}

      - name: Fetch the pinned runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/fetch-runtime-win.ps1

      - name: Tests
        run: node tools/run-tests.js

      - name: Install Electron and electron-builder
        working-directory: win
        run: npm ci --no-audit --no-fund

      - name: Build the installer
        working-directory: win
        run: npm run pack:release

      - name: Verify the signature
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $bad = $false
          foreach ($exe in @(Get-ChildItem win\dist -Filter "ClipSpike-*-x64*.exe")) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "$($exe.Name): $($sig.Status)"
            if ($sig.Status -ne "Valid") { Write-Host "::error::$($exe.Name) signature is $($sig.Status)"; $bad = $true }
          }
          if ($bad) { exit 1 }

      - name: Verify the update feed file
        shell: pwsh
        run: |
          if (-not (Test-Path win\dist\latest.yml)) { Write-Host "::error::latest.yml was not produced"; exit 1 }
          if (-not (Test-Path win\dist\win-unpacked\resources\app-update.yml)) { Write-Host "::error::app-update.yml (feed config) is missing from the app"; exit 1 }
          Get-Content win\dist\latest.yml
          # Differential updates need the installer's .blockmap on the feed. Publish it when the build makes one.
          if (-not (Get-ChildItem win\dist -Filter "ClipSpike-*-x64.exe.blockmap")) { Write-Host "::warning::No .blockmap was produced; every update will download the full installer." }

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSpike-windows-release
          path: |
            win/dist/ClipSpike-*-x64.exe
            win/dist/ClipSpike-*-x64.exe.blockmap
            win/dist/ClipSpike-*-x64-portable.exe
            win/dist/latest.yml
          if-no-files-found: error

      - name: Attach to a draft GitHub release
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem win\dist -Filter "ClipSpike-*-x64.exe") + @(Get-ChildItem win\dist -Filter "ClipSpike-*-x64.exe.blockmap") + @(Get-ChildItem win\dist -Filter "ClipSpike-*-x64-portable.exe") + @(Get-ChildItem win\dist -Filter latest.yml -ErrorAction SilentlyContinue)
          $notes = "Windows build"
          if ($env:SIGNED -ne "true") {
            $notes = "Windows build. **UNSIGNED**: no code-signing certificate was configured, so Windows SmartScreen will show an 'unknown publisher' warning (More info, then Run anyway)."
          }
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes $notes ($files.FullName)

      # Publishes the update feed. Installer first, then latest.yml, so clients never
      # see a feed that points at a missing file. WIN_UPDATE_URL must be
      # <public base>/<WIN_R2_PREFIX>/ for this bucket.
      - name: Upload to Cloudflare R2 (optional)
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if (-not ($env:R2_ACCOUNT_ID -and $env:R2_ACCESS_KEY_ID -and $env:R2_SECRET_ACCESS_KEY -and $env:R2_BUCKET)) {
            Write-Host "::notice::R2_* secrets are not set in this repo; skipping upload. Host the installer and latest.yml at WIN_UPDATE_URL yourself (see docs/WINDOWS_RELEASE.md)."
            exit 0
          }
          $endpoint = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          $prefix = $env:WIN_R2_PREFIX.Trim("/")
          $exe = Get-ChildItem win\dist -Filter "ClipSpike-*-x64.exe" | Select-Object -First 1
          # Releases are immutable: never replace an installer clients may already have cached.
          node win/tools/release-guards.js not-published $env:WIN_UPDATE_URL $exe.Name
          if ($LASTEXITCODE -ne 0) { exit 1 }
          aws s3 cp $exe.FullName "s3://$($env:R2_BUCKET)/$prefix/$($exe.Name)" --endpoint-url $endpoint
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The blockmap goes up before latest.yml, so a client never sees a version without it.
          $blockmap = Get-ChildItem win\dist -Filter "$($exe.Name).blockmap" | Select-Object -First 1
          if ($blockmap) {
            aws s3 cp $blockmap.FullName "s3://$($env:R2_BUCKET)/$prefix/$($blockmap.Name)" --endpoint-url $endpoint
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          aws s3 cp win\dist\latest.yml "s3://$($env:R2_BUCKET)/$prefix/latest.yml" --endpoint-url $endpoint --cache-control "no-cache"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Uploaded to $prefix/ in the R2 bucket. Check: $($env:WIN_UPDATE_URL.TrimEnd('/'))/latest.yml"
          # Confirm what clients will actually get: the live latest.yml matches this build, and the
          # installer they would download has the size and sha512 it promises.
          node win/tools/release-guards.js verify $env:WIN_UPDATE_URL win\dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
