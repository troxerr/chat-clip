name: ClipSpike public site health

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/scripts/check-public-site.mjs
