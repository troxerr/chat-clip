# Release packaging uses Azure Artifact Signing and the public update feed.
extends: electron-builder.yml
win:
  signAndEditExecutable: true
  forceCodeSigning: true
  azureSignOptions:
    publisherName: Austin Taylor
    endpoint: https://eus.codesigning.azure.net/
    codeSigningAccountName: ClipSpikeSigning
    certificateProfileName: ClipSpike
  artifactName: ClipSpike-${version}-x64.exe
portable:
  artifactName: ClipSpike-${version}-x64-portable.exe
# Writes latest.yml next to the installer for a generic update feed.
# WIN_UPDATE_URL is the public folder that will host both files.
publish:
  provider: generic
  url: ${env.WIN_UPDATE_URL}
