<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ClipSpike</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>ClipSpike</div>
      <button class="nav" data-page="capture" aria-current="page"><span class="nav-icon" data-icon="record" aria-hidden="true"></span>Capture</button>
      <button class="nav" data-page="clips"><span class="nav-icon" data-icon="film" aria-hidden="true"></span>Clips</button>
      <button class="nav" data-page="settings"><span class="nav-icon" data-icon="gear" aria-hidden="true"></span>Settings</button>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>
    <main class="content" id="content" tabindex="-1">
      <div id="notice" class="notice" role="alert" hidden></div>
      <section id="page-capture" class="page" aria-labelledby="h-capture"></section>
      <section id="page-clips" class="page" aria-labelledby="h-clips" hidden></section>
      <section id="page-settings" class="page" aria-labelledby="h-settings" hidden></section>
    </main>
  </div>
  <script src="start-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
