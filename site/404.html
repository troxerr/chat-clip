<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — ClipSpike</title>
<script>
// GitHub Pages serves only this root 404.html. For app deep links, stash the path and boot
// the SPA at /app/; web/src/lib/legacyRoutes.ts restores it with history.replaceState.
(function () {
  var p = location.pathname;
  if (p.indexOf('/app/') === 0) {
    try { sessionStorage.setItem('clipspike:spa-redirect', p + location.search); } catch (e) {}
    location.replace('/app/');
  }
})();
</script>
